<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%231e3a6e%27/%3E%3Cpath fill=%27%23d9a93f%27 d=%27M9.5 3h5v6H21v5h-6.5v7h-5v-7H3V9h6.5z%27/%3E%3C/svg%3E">
<title>كنيسة الملاك ميخائيل بدهروط | متابعة الخدمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EC; --surface:#FFFFFF; --surface2:#FBF3E2; --ink:#2B1B12; --ink2:#6B5238; --line:#E6D6AF;
  --primary:#A9761F; --primary-ink:#FFFFFF; --primary-soft:#F3E6C4;
  --gold:#C9922E; --side:#551627; --side-ink:#F3E6C4; --side-dim:#CDA1A8;
  --p:#2E7D5A; --p-bg:#DDF0E6; --a:#B23A2E; --a-bg:#F8DFDB; --e:#94691A; --e-bg:#F6EACB;
  --track:#EFE1BC; --shadow:0 1px 2px rgba(60,20,20,.09),0 8px 24px -12px rgba(60,20,20,.24);
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif; --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1408; --surface:#241C0D; --surface2:#2A210F; --ink:#F3EBD6; --ink2:#C3AD7C; --line:#3E3115;
    --primary:#D9A94B; --primary-ink:#1B1408; --primary-soft:#3E3115;
    --gold:#F0C978; --side:#2E0B14; --side-ink:#F3E6C4; --side-dim:#B98A8F;
    --p:#5CC59A; --p-bg:#173A2D; --a:#FF8F82; --a-bg:#4A201C; --e:#E6B95E; --e-bg:#43361A;
    --track:#3E3115; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1408; --surface:#241C0D; --surface2:#2A210F; --ink:#F3EBD6; --ink2:#C3AD7C; --line:#3E3115;
  --primary:#D9A94B; --primary-ink:#1B1408; --primary-soft:#3E3115;
  --gold:#F0C978; --side:#2E0B14; --side-ink:#F3E6C4; --side-dim:#B98A8F;
  --p:#5CC59A; --p-bg:#173A2D; --a:#FF8F82; --a-bg:#4A201C; --e:#E6B95E; --e-bg:#43361A;
  --track:#3E3115; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{overflow-x:hidden;width:100%}
body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.3}
h1{font-size:28px} h2{font-size:20px} h3{font-size:17px}
small,.muted{color:var(--ink2)}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.brand .mark{color:var(--gold);display:grid;place-items:center}
.brand b{font-family:var(--display);font-size:19px;line-height:1.3;display:block}
.brand small{color:var(--side-dim);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--side-ink);padding:11px 12px;border-radius:10px;text-align:start;border-inline-start:3px solid transparent;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(255,255,255,.09);border-inline-start-color:var(--gold);font-weight:700}
.userbox{border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 2px;display:flex;flex-direction:column;gap:10px}
.userbox .nm{font-weight:600}
.userbox .rl{color:var(--side-dim);font-size:13px}
.userbox .row{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--side-ink);padding:6px 0;display:inline-flex;gap:8px;align-items:center;font-size:14px;opacity:.85}
.linkbtn:hover{opacity:1;text-decoration:underline}
.modebadge{font-size:12px;color:var(--side-dim)}
.main{padding:30px 36px 70px;max-width:1120px;width:100%}
.mtop{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph p{margin:4px 0 0;color:var(--ink2)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--a);border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.icon-btn{background:none;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--surface2)}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.fld.inline{flex-direction:row;align-items:center;gap:10px}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=tel],input[type=time],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;font-weight:400}
textarea{min-height:88px;resize:vertical}
.fld.inline input,.fld.inline select{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:150px}
.searchbox{position:relative}
.searchbox .icon{position:absolute;inset-inline-start:12px;top:12px;color:var(--ink2)}
.searchbox input{padding-inline-start:40px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
.card>h2,.card>h3{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.2}
.stat .l{color:var(--ink2);font-size:14px}
.cols2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.pill.good{background:var(--p-bg);color:var(--p)} .pill.mid{background:var(--e-bg);color:var(--e)} .pill.bad{background:var(--a-bg);color:var(--a)} .pill.late{background:var(--primary-soft);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:1px 9px;font-size:13px;font-weight:500}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--ink2);font-weight:600;background:var(--surface2)}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rate{display:flex;align-items:center;gap:10px;min-width:130px}
.rate .tr{flex:1;height:8px;background:var(--track);border-radius:9px;overflow:hidden}
.rate .tr i{display:block;height:100%;background:var(--p);border-radius:9px}
.rate .tr i.mid{background:var(--e)} .rate .tr i.bad{background:var(--a)}
.rate span{font-weight:600;min-width:42px}

/* member rows */
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:start;width:100%}
.mrow:hover{border-color:var(--primary)}
.av{width:42px;height:42px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--display)}
.mi{flex:1;min-width:0;display:flex;flex-direction:column}
.mi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{display:flex;gap:10px;flex-wrap:wrap}
.mr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* attendance sheet */
.sheetbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.cnt{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.cnt span{display:inline-flex;gap:6px;align-items:baseline;font-weight:600}
.cnt b{font-family:var(--display);font-size:22px}
.cnt .p{color:var(--p)} .cnt .a{color:var(--a)} .cnt .e{color:var(--e)} .cnt .n{color:var(--ink2)}
.prog{height:6px;background:var(--track);border-radius:9px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--primary)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.arow.st-p{border-inline-start-color:var(--p)} .arow.st-a{border-inline-start-color:var(--a)} .arow.st-e{border-inline-start-color:var(--e)} .arow.st-l{border-inline-start-color:var(--primary)}
.arow .who{display:flex;flex-direction:column;min-width:0}
.arow .who b{font-size:17px}
.arow .who small{color:var(--a);font-weight:600}
.seg{display:flex;gap:6px;flex:none}
.sb{min-width:66px;min-height:46px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink2)}
.sb.p.on{background:var(--p);border-color:var(--p);color:#fff}
.sb.a.on{background:var(--a);border-color:var(--a);color:#fff}
.sb.e.on{background:var(--e);border-color:var(--e);color:#fff}
.sb.l.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
[data-theme="dark"] .sb.on,:root:not([data-theme="light"]) .sb.on{color:#0D1424}
.sb:not(.on):hover{border-color:var(--ink2)}
.timefld{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);flex:none}
.timefld input{width:auto;min-width:110px;min-height:40px}

/* charts */
.cols{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.col{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:4px}
.col .bar{width:100%;height:130px;display:flex;align-items:flex-end;background:var(--track);border-radius:8px;overflow:hidden}
.col .bar i{display:block;width:100%;background:var(--primary);border-radius:8px 8px 0 0}
.col .cv{font-weight:700;font-size:13px}
.col .cl{font-size:12px;color:var(--ink2);white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:150px 1fr 52px;gap:12px;align-items:center}
.hbar .tr{height:14px;background:var(--track);border-radius:9px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--primary);border-radius:9px}
.hbar b{text-align:end}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:11px;color:var(--ink2);font-weight:700}
.dot.l{background:var(--primary);color:var(--primary-ink)} .dot.p{background:var(--p);color:#fff} .dot.a{background:var(--a);color:#fff} .dot.e{background:var(--e);color:#fff}

/* stars */
.crit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stars{display:flex;gap:2px}
.star{background:none;border:0;font-size:30px;line-height:1;color:var(--track);padding:2px 4px;min-width:40px;min-height:44px}
.star.on{color:var(--gold)}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--surface2)}

/* modal */
#modal .scrim{position:fixed;inset:0;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet.wide{max-width:680px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-b{padding:18px 20px;overflow-y:auto}
.sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.checks{display:flex;flex-direction:column;gap:4px}
.checks .grp{font-weight:700;margin-top:8px;color:var(--ink2);font-size:14px}
.check{display:flex;gap:10px;align-items:center;min-height:36px;font-weight:400}
.check input{width:20px;height:20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--ink2)} .kv dd{margin:0}
#toast{position:fixed;inset-inline:0;bottom:24px;display:flex;justify-content:center;pointer-events:none;z-index:80}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}
#toast div.err{background:var(--a);color:#fff}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-l{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.auth-l .mark{color:var(--gold)}
.auth-l h1{font-size:38px;color:#fff}
.auth-l p{color:var(--side-dim);max-width:34ch;margin:0}
.auth-r{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.hint{font-size:14px;color:var(--ink2);margin:0}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--ink2)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-inline:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;z-index:20;border-top:1px solid rgba(255,255,255,.1)}
  .brand,.userbox{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 10px;min-width:70px;font-size:12px;border-inline-start:0;border-top:3px solid transparent;border-radius:8px;justify-content:center;align-items:center;text-align:center}
  .nav button.on{border-top-color:var(--gold)}
  .main{padding:16px 14px 100px}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--ink2);font-size:14px}
  .mtop .r{display:flex;gap:4px}
  h1{font-size:24px}
  .cols2{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth-l{padding:28px}
  .auth-l h1{font-size:28px}
  .hbar{grid-template-columns:100px 1fr 46px}
  .arow{flex-direction:column;align-items:stretch}
  .seg .sb{flex:1}
}
@media (prefers-reduced-motion:no-preference){
  .sb,.btn,.mrow{transition:background .15s,border-color .15s}
}
#printHead{display:none}
@media print{
  body.printing *{visibility:hidden}
  body.printing #printHead, body.printing #printHead *,
  body.printing #main, body.printing #main *{visibility:visible}
  body.printing #printHead{display:flex;align-items:center;gap:16px;position:fixed;top:0;inset-inline-start:0;width:100%;padding:10px 0 14px;border-bottom:3px solid var(--gold);margin-bottom:14px}
  body.printing #printHead .p-logo{flex:none}
  body.printing #printHead .p-info h1{font-size:20px;margin:0}
  body.printing #printHead .p-info h2{font-size:15px;margin:2px 0 0;color:var(--gold)}
  body.printing #printHead .p-info p{font-size:12px;margin:2px 0 0;color:#555}
  body.printing #main{position:absolute;top:110px;inset-inline-start:0;width:100%;padding:0}
  body.printing .side,body.printing .mtop,body.printing .toolbar,body.printing .tabs,body.printing .btn,body.printing .icon-btn,body.printing .ph .actions{display:none !important}
  body.printing .app{display:block}
}
</style>

const COLS = ['config','services','classes','servants','members','roster','att','ev'];
const S = {}; COLS.forEach(c => S[c] = {});
const CFG = window.CHURCH_CONFIG || {};
const sb = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'church-auth'}})
  : null;
const dl = true;
const EMAIL_DOMAIN = '@church.local';
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
async function emailFor(name){ return 'u' + (await sha256(norm(name))).slice(0, 32) + EMAIL_DOMAIN; }

async function rpc(name, args){ const r = await sb.rpc(name, args || {}); if (r.error) throw r.error; return r.data; }
const chk = r => { if (r.error) throw r.error; return r; };
function errText(e){
  const m = String((e && (e.message || e.details || e.hint)) || e || '');
  if (/duplicate_name|duplicate key|already exists/i.test(m)) return 'الاسم ده مستخدم بالفعل. أضف حرف أو اسم تاني للتمييز';
  if (/weak_password/.test(m)) return 'كلمة المرور لازم تكون ٦ أحرف على الأقل';
  if (/wrong_password/.test(m)) return 'كلمة المرور الحالية غير صحيحة';
  if (/already_setup/.test(m)) return 'النظام اتجهّز قبل كده. سجّل دخول بالاسم وكلمة المرور';
  if (/not_allowed|row-level security|permission denied|42501/i.test(m)) return 'ليس لديك صلاحية لتنفيذ ده';
  if (/Failed to fetch|NetworkError|network|Load failed/i.test(m)) return 'مفيش اتصال بالإنترنت. حاول تاني';
  return 'حصل خطأ: ' + m.slice(0, 90);
}

/* ---- reading ---- */
const PAGE = 1000;
async function fetchAll(table, cols, orders){
  let out = [], from = 0;
  for (;;) {
    let q = sb.from(table).select(cols);
    orders.forEach(o => { q = q.order(o); });
    const r = await q.range(from, from + PAGE - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < PAGE) break;
    from += PAGE;
  }
  return out;
}
const byMonth = (rows, dayKey, add) => { const docs = {}; rows.forEach(r => { const m = String(r[dayKey]).slice(0, 7); add(docs[m] = docs[m] || {}, r); }); return Object.keys(docs).map(k => ({id:k, data:docs[k]})); };
const LOAD = {
  config: async () => (await fetchAll('config', 'key,data', ['key'])).map(r => ({id:r.key, data:r.data})),
  services: async () => (await fetchAll('services', 'id,data', ['id'])).map(r => ({id:r.id, data:r.data})),
  classes: async () => (await fetchAll('classes', 'id,data', ['id'])).map(r => ({id:r.id, data:r.data})),
  members: async () => (await fetchAll('members', 'id,data', ['id'])).map(r => ({id:r.id, data:r.data})),
  roster: async () => (await fetchAll('roster', 'id,data', ['id'])).map(r => ({id:r.id, data:r.data})),
  servants: async () => (await fetchAll('profiles', 'id,name,phone,role,active,class_ids', ['id'])).filter(p => p.role === 'servant')
    .map(p => ({id:p.id, data:{name:p.name, phone:p.phone || '', active:p.active, classIds:p.class_ids || []}})),
  att: async () => byMonth(await fetchAll('attendance', 'person_id,day,status,arrival_time', ['day', 'person_id']), 'day',
    (d, r) => { d.days = d.days || {}; (d.days[r.day] = d.days[r.day] || {})[r.person_id] = r.status; if (r.arrival_time) { d.times = d.times || {}; (d.times[r.day] = d.times[r.day] || {})[r.person_id] = r.arrival_time; } }),
  ev: async () => byMonth(await fetchAll('evaluations', 'key,day,data', ['key']), 'day',
    (d, r) => { d.items = d.items || {}; d.items[r.key] = r.data; })
};

/* ---- writing ---- */
const DB = {
  async set(col, id, d){
    if (col === 'config') chk(await sb.from('config').upsert({key:id, data:d}));
    else if (col === 'services' || col === 'classes') chk(await sb.from(col).upsert({id, data:d}));
    else if (col === 'members') chk(await sb.from('members').upsert({id, class_id:d.classId || null, data:d}));
    else if (col === 'roster') chk(await sb.from('roster').upsert({id, data:d}));
    else if (col === 'servants') chk(await sb.from('profiles').update({name:d.name, phone:d.phone || '', class_ids:d.classIds || [], active:d.active !== false}).eq('id', id));
    else await DB.update(col, id, d);
  },
  async update(col, id, p){
    if (col === 'att') {
      const ups = {}, dels = {};
      const row = (day, pid) => ups[day + '|' + pid] || (ups[day + '|' + pid] = {person_id:pid, day});
      Object.keys(p.days || {}).forEach(day => Object.keys(p.days[day]).forEach(pid => {
        const st = p.days[day][pid];
        if (st) row(day, pid).status = st; else (dels[day] = dels[day] || []).push(pid);
      }));
      Object.keys(p.times || {}).forEach(day => Object.keys(p.times[day]).forEach(pid => { row(day, pid).arrival_time = p.times[day][pid] || null; }));
      const upsRows = Object.values(ups).filter(r => r.status);
      if (upsRows.length) chk(await sb.from('attendance').upsert(upsRows, {onConflict:'person_id,day'}));
      for (const day of Object.keys(dels)) chk(await sb.from('attendance').delete().eq('day', day).in('person_id', dels[day]));
    } else if (col === 'ev') {
      const ups = [], dels = [];
      Object.keys(p.items || {}).forEach(key => {
        const it = p.items[key];
        if (it.deleted === true) dels.push(key); else ups.push({key, member_id:it.memberId, day:it.date, data:it});
      });
      if (ups.length) chk(await sb.from('evaluations').upsert(ups, {onConflict:'key'}));
      if (dels.length) chk(await sb.from('evaluations').delete().in('key', dels));
    } else await DB.set(col, id, S[col][id] || p);
  },
  async del(col, id){
    if (col === 'servants') await rpc('admin_delete_account', {p_id:id});
    else if (col === 'att') chk(await sb.from('attendance').delete().gte('day', id + '-01').lte('day', id + '-31'));
    else if (col === 'ev') chk(await sb.from('evaluations').delete().gte('day', id + '-01').lte('day', id + '-31'));
    else if (col === 'config') chk(await sb.from('config').delete().eq('key', id));
    else chk(await sb.from(col).delete().eq('id', id));
  }
};

/* ---- live sync ---- */
const TABLE2COL = {config:'config', services:'services', classes:'classes', members:'members', roster:'roster', profiles:'servants', attendance:'att', evaluations:'ev'};
const seen = new Set(); const rTimers = {};
let syncOn = false, chan = null, pollT = null, synced = false;
function applySnap(col, list){
  const map = {}; list.forEach(x => { map[x.id] = clone(x.data); });
  const o = optim[col] || {}; Object.keys(o).forEach(id => { if (o[id].v === null) delete map[id]; else map[id] = o[id].v; });
  S[col] = map; seen.add(col);
  if (!synced && seen.size === COLS.length) synced = true;
  scheduleRender();
}
async function refreshCol(col){
  if (!syncOn) return;
  try { applySnap(col, await LOAD[col]()); }
  catch (e) {
    console.error(e); seen.add(col);
    if (!synced && seen.size === COLS.length) { synced = true; scheduleRender(); }
  }
}
function scheduleRefresh(col, delay){ clearTimeout(rTimers[col]); rTimers[col] = setTimeout(() => refreshCol(col), delay == null ? 700 : delay); }
function refreshAll(delay){ COLS.forEach(c => scheduleRefresh(c, delay)); }
function startSync(){
  if (syncOn) return; syncOn = true; seen.clear(); synced = false;
  COLS.forEach(c => refreshCol(c));
  try {
    chan = sb.channel('church-live').on('postgres_changes', {event:'*', schema:'public'}, p => { const c = TABLE2COL[p.table]; if (c) scheduleRefresh(c); }).subscribe();
  } catch (e) { console.error(e); }
  pollT = setInterval(() => { if (!document.hidden) refreshAll(0); }, 45000);
}
function stopSync(){
  syncOn = false; synced = false; seen.clear();
  try { if (chan) sb.removeChannel(chan); } catch (e) {}
  chan = null; clearInterval(pollT);
  Object.keys(rTimers).forEach(k => clearTimeout(rTimers[k]));
  COLS.forEach(c => S[c] = {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && syncOn) refreshAll(0); });

let seq = 0; const optim = {};
function markOptim(col, id, v){ const s = ++seq; (optim[col] = optim[col] || {})[id] = {v, seq: s}; return s; }
const wq = []; const pendingMerge = new Map(); let running = false;
function enqueue(op){
  const k = op.col + '/' + op.id;
  if (op.kind === 'merge') {
    const ex = pendingMerge.get(k);
    if (ex) { ex.patch = deepMerge(ex.patch, op.patch); ex.seq = op.seq; return; }
    pendingMerge.set(k, op);
  } else pendingMerge.delete(k);
  wq.push(op); pump();
}
async function runOp(op, attempt){
  attempt = attempt || 0;
  try {
    if (op.kind === 'set') await DB.set(op.col, op.id, op.data);
    else if (op.kind === 'del') await DB.del(op.col, op.id);
    else {
      try { await DB.update(op.col, op.id, op.patch); }
      catch (e) { if (e && e.code === 'invalid_argument') await DB.set(op.col, op.id, op.patch); else throw e; }
    }
  } catch (e) {
    if (attempt < 4 && e && (e.code === 'resource_exhausted' || e.code === 'unavailable')) { await sleep(500 * (attempt + 1)); return runOp(op, attempt + 1); }
    throw e;
  }
}
async function pump(){
  if (running) return; running = true;
  while (wq.length) {
    const op = wq.shift();
    if (op.kind === 'merge' && pendingMerge.get(op.col + '/' + op.id) === op) pendingMerge.delete(op.col + '/' + op.id);
    try { await runOp(op); if (syncOn) scheduleRefresh(op.col, 500); }
    catch (e) { console.error(e); toast(errText(e), 'err'); if (syncOn) refreshAll(300); }
    const o = optim[op.col] && optim[op.col][op.id];
    if (o && o.seq === op.seq) delete optim[op.col][op.id];
    await sleep(30);
  }
  running = false;
}
function put(col, id, data){ S[col][id] = data; const s = markOptim(col, id, data); enqueue({kind:'set', col, id, data, seq:s}); scheduleRender(); }
function patch(col, id, p){ const m = deepMerge(S[col][id] || {}, p); S[col][id] = m; const s = markOptim(col, id, m); enqueue({kind:'merge', col, id, patch:p, seq:s}); scheduleRender(); }
function remove(col, id){ delete S[col][id]; const s = markOptim(col, id, null); enqueue({kind:'del', col, id, seq:s}); scheduleRender(); }

/* attendance data */
const getStatus = (pid, date) => { const m = S.att[monthOf(date)]; return (m && m.days && m.days[date] && m.days[date][pid]) || ''; };
const setStatus = (pid, date, st) => patch('att', monthOf(date), {days:{[date]:{[pid]:st}}});
const getTime = (pid, date) => { const m = S.att[monthOf(date)]; return (m && m.times && m.times[date] && m.times[date][pid]) || ''; };
const setTime = (pid, date, tm) => patch('att', monthOf(date), {days:{[date]:{[pid]:getStatus(pid, date)}}, times:{[date]:{[pid]:tm}}});
function collect(ids, from, to){
  const set = new Set(ids), per = {}, perDate = {};
  ids.forEach(id => per[id] = {p:0, a:0, e:0, l:0, dates:{}});
  Object.keys(S.att).forEach(mk => {
    const days = S.att[mk].days || {};
    Object.keys(days).forEach(d => {
      if ((from && d < from) || (to && d > to)) return;
      const rec = days[d];
      Object.keys(rec).forEach(pid => {
        const st = rec[pid]; if (!st || !set.has(pid)) return;
        per[pid][st]++; per[pid].dates[d] = st;
        (perDate[d] = perDate[d] || {p:0, a:0, e:0, l:0})[st]++;
      });
    });
  });
  return {per, perDate, dates: Object.keys(perDate).sort()};
}
const rateOf = r => { if (!r) return null; const t = r.p + r.a + r.e + (r.l || 0); return t ? r.p / t * 100 : null; };
const rateCls = r => r == null ? '' : r >= 75 ? 'good' : r >= 50 ? 'mid' : 'bad';
function streakMap(members){
  const out = {}, byCls = {};
  members.forEach(m => (byCls[m.classId] = byCls[m.classId] || []).push(m));
  Object.keys(byCls).forEach(cid => {
    const peers = membersOf(cid).map(m => m.id);
    const dates = collect(peers).dates.slice().reverse();
    byCls[cid].forEach(m => { let n = 0; for (const d of dates) { if (getStatus(m.id, d) === 'a') n++; else break; } out[m.id] = n; });
  });
  return out;
}
/* evaluations */
function allEvals(){
  const out = [];
  Object.keys(S.ev).forEach(mk => { const it = S.ev[mk].items || {}; Object.keys(it).forEach(k => { if (it[k] && !it[k].deleted) out.push(Object.assign({key:k}, it[k])); }); });
  return out;
}
const evKey = (mid, date) => mid + '__' + date;
const getEval = (mid, date) => { const m = S.ev[monthOf(date)]; const e = m && m.items && m.items[evKey(mid, date)]; return e && !e.deleted ? e : null; };
const evAvg = e => { const v = Object.keys(e.scores || {}).map(k => e.scores[k]).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
function evalStats(ids, from, to){
  const set = new Set(ids), out = {};
  allEvals().forEach(e => {
    if (!set.has(e.memberId) || (from && e.date < from) || (to && e.date > to)) return;
    const o = out[e.memberId] = out[e.memberId] || {n:0, sum:{}, cnt:{}};
    o.n++;
    Object.keys(e.scores || {}).forEach(k => { o.sum[k] = (o.sum[k] || 0) + e.scores[k]; o.cnt[k] = (o.cnt[k] || 0) + 1; });
  });
  Object.keys(out).forEach(id => { const o = out[id]; let s = 0, c = 0; Object.keys(o.sum).forEach(k => { s += o.sum[k]; c += o.cnt[k]; }); o.avg = c ? s / c : null; });
  return out;
}

  else if (r.range === '3m') from = ymd(new Date(t.getFullYear(), t.getMonth() - 2, 1));
  else if (r.range === 'year') from = ymd(new Date(t.getFullYear(), 0, 1));

  return {from, to};

  const tp = rows.reduce((a, x) => a + x.rec.p, 0), ta = rows.reduce((a, x) => a + x.rec.a, 0), te = rows.reduce((a, x) => a + x.rec.e, 0), tl = rows.reduce((a, x) => a + x.rec.l, 0), tt = tp + ta + te + tl;

  lastReport = {name:'attendance', rows:[['المخدوم','الفصل','الخدمة','حاضر','متأخر','غائب','معتذر','نسبة الحضور %','متوسط التقييم']].concat(sorted.map(x => [x.m.name, clsName(x.m.classId), clsSvc(x.m.classId), x.rec.p, x.rec.l, x.rec.a, x.rec.e, x.rate == null ? '' : Math.round(x.rate), es[x.m.id] ? Math.round(es[x.m.id].avg * 10) / 10 : '']))};

    } catch (e) { toast(errText(e), 'err'); } finally { busy = false; }

    if (!classId) return toast('اختر الفصل', 'err');
    const classObj = S.classes[classId]; if (!classObj) return toast('اختر فصل صحيح', 'err');
    const name = classObj.name, id = modalCtx.id, old = id ? S.servants[id] : null, nn = norm(name);
    const dupClass = arr('servants').some(s => s.id !== id && (s.classIds || []).indexOf(classId) > -1);
    if (dupClass) return toast('الفصل ده له حساب بالفعل. عدّل الحساب الموجود بدل إنشاء واحد جديد', 'err');
    const taken = arr('servants').some(s => s.id !== id && norm(s.name) === nn) || norm((cfg().admin || {}).name) === nn;
    if (taken) return toast('في حساب تاني بنفس الاسم. غيّر اسم الفصل من صفحة الخدمات والفصول الأول', 'err');
    if (!old && pw.length < 6) return toast('كلمة المرور ٦ أحرف على الأقل', 'err');
    if (pw && pw.length < 6) return toast('كلمة المرور ٦ أحرف على الأقل', 'err');
    const classIds = [classId];
    busy = true;
    try {
      if (!old) {
        const nid = await rpc('admin_create_account', {p_email:await emailFor(name), p_password:pw, p_name:name, p_phone:'', p_class_ids:classIds});
        put('servants', nid, {name, phone:'', classIds, active});
      } else {
        const changed = norm(old.name) !== nn;
        if (changed || pw) await rpc('admin_update_account', {p_id:id, p_email:changed ? await emailFor(name) : null, p_password:pw || null});
        put('servants', id, {name, phone:'', classIds, active});
      }
      closeModal(); toast('تم حفظ الحساب');
    } catch (e) { toast(errText(e), 'err'); } finally { busy = false; }
  },
  delServant(t){ const id = t.dataset.id; confirmBox('سيُحذف حساب الخادم «' + esc((S.servants[id] || {}).name) + '». سجل حضوره القديم لن يظهر بعد ذلك.', 'حذف الخادم', () => { remove('servants', id); toast('تم الحذف'); }); },
  editService(t){ const id = t && t.dataset ? t.dataset.id : null; simpleForm(id ? 'تعديل الخدمة' : 'إضافة خدمة', id ? S.services[id].name : '', '', 'saveService', id); },
  saveService(){
    const name = V('name').trim(); if (!name) return toast('اكتب اسم الخدمة', 'err');
    const id = modalCtx.id || uid('sv'), old = S.services[id];
    put('services', id, {name, order: old ? old.order : (services().length + 1) * 10}); closeModal(); toast('تم الحفظ');
  },
  delService(t){
    const id = t.dataset.id;
    if (classes().some(c => c.serviceId === id)) return toast('احذف فصول هذه الخدمة أو انقلها أولاً', 'err');
    confirmBox('حذف الخدمة «' + esc(svcName(id)) + '»؟', 'حذف الخدمة', () => { remove('services', id); toast('تم الحذف'); });
  },
  editClass(t){
    const id = t.dataset.id, sid = id ? S.classes[id].serviceId : t.dataset.service;
    simpleForm(id ? 'تعديل الفصل' : 'إضافة فصل إلى ' + svcName(sid), id ? S.classes[id].name : '', `<label class="fld">الخدمة<select name="serviceId">${services().map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`, 'saveClass', id);
  },
  saveClass(){
    const name = V('name').trim(); if (!name) return toast('اكتب اسم الفصل', 'err');
    const id = modalCtx.id || uid('c'), old = S.classes[id];
    put('classes', id, {name, serviceId:V('serviceId'), order: old ? old.order : Date.now() % 100000}); closeModal(); toast('تم الحفظ');
  },
  delClass(t){
    const id = t.dataset.id;
    if (arr('members').some(m => m.classId === id)) return toast('انقل مخدومي هذا الفصل أو احذفهم أولاً', 'err');
    confirmBox('حذف الفصل «' + esc(clsName(id)) + '»؟', 'حذف الفصل', () => {
      arr('servants').forEach(s => { if ((s.classIds || []).indexOf(id) > -1) put('servants', s.id, Object.assign({}, S.servants[s.id], {classIds:s.classIds.filter(x => x !== id)})); });
      remove('classes', id); toast('تم الحذف');
    });
  },
  evaluate(t){ closeModal(); if (!(isAdmin() || (S.members[t.dataset.id] && allowedClassIds().has(S.members[t.dataset.id].classId)))) return; evalForm(t.dataset.id); },
  star(t){
    if (!evDraft) return; const k = t.dataset.crit, v = Number(t.dataset.v);
    evDraft.scores[k] = evDraft.scores[k] === v ? 0 : v;
    Array.from(t.parentElement.children).forEach((b, i) => b.classList.toggle('on', i < evDraft.scores[k]));
  },
  saveEval(){
    if (!evDraft) return; const m = S.members[evDraft.memberId]; if (!m) return;
    if (!(isAdmin() || allowedClassIds().has(m.classId))) return toast('ليس لديك صلاحية تقييم هذا المخدوم', 'err');
    const scores = {}; Object.keys(evDraft.scores).forEach(k => { if (evDraft.scores[k] > 0) scores[k] = evDraft.scores[k]; });
    if (!Object.keys(scores).length) return toast('اختر تقييمًا واحدًا على الأقل', 'err');
    const mid = evDraft.memberId, d = evDraft.date, key = evKey(mid, d);
    patch('ev', monthOf(d), {items:{[key]:{memberId:mid, classId:m.classId, servantId:me.role === 'servant' ? me.id : 'admin', date:d, scores, note:V('note').trim(), ts:Date.now(), deleted:false}}});
    closeModal(); toast('تم حفظ التقييم');
  },
  delEval(){ if (!evDraft) return; const dm = S.members[evDraft.memberId]; if (!dm || !(isAdmin() || allowedClassIds().has(dm.classId))) return; const d = evDraft.date; patch('ev', monthOf(d), {items:{[evKey(evDraft.memberId, d)]:{deleted:true}}}); closeModal(); toast('تم حذف التقييم'); },
  repTab(t){ ui.rep.tab = t.dataset.v; render(); },
  changePw(){
    openModal('تغيير كلمة المرور', `<div class="stack"><label class="fld">كلمة المرور الحالية<input type="password" name="old" dir="ltr" style="text-align:end" autocomplete="current-password"></label><label class="fld">كلمة المرور الجديدة<input type="password" name="new" dir="ltr" style="text-align:end" autocomplete="new-password"></label></div>`, `<button class="btn primary" data-a="savePw">حفظ</button><button class="btn" data-a="closeModal">إلغاء</button>`);
  },
  async savePw(){
    const o = V('old'), n = V('new');
    if (n.length < 6) return toast('كلمة المرور الجديدة ٦ أحرف على الأقل', 'err');
    try { await rpc('change_my_password', {p_old:o, p_new:n}); closeModal(); toast('تم تغيير كلمة المرور'); }
    catch (e) { toast(errText(e), 'err'); }
  },
  removeLogo(){ const c = Object.assign({}, cfg()); delete c.logoUrl; put('config', 'main', c); toast('تم الرجوع للشعار الأصلي'); },
  saveSettings(){
    const name = $('#st_church').value.trim(); if (!name) return toast('اكتب اسم الكنيسة', 'err');
    const crs = Array.from(document.querySelectorAll('[data-crit-id]')).map(el => ({id:el.dataset.critId, name:el.value.trim() || 'معيار'}));
    put('config', 'main', Object.assign({}, cfg(), {churchName:name, criteria:crs})); toast('تم حفظ الإعدادات');
  },
  async saveAdmin(){
    if (!isAdmin() || busy) return;
    const name = $('#ad_user').value.trim(), pw = $('#ad_pass').value;
    if (!name) return toast('اكتب الاسم', 'err');
    if (arr('servants').some(s => norm(s.name) === norm(name))) return toast('الاسم ده مستخدم لخادم آخر', 'err');
    if (pw && pw.length < 6) return toast('كلمة المرور ٦ أحرف على الأقل', 'err');
    const c = cfg(), changed = norm(name) !== norm((c.admin || {}).name);
    busy = true;
    try {
      if (changed || pw) await rpc('admin_update_account', {p_id:me.id, p_email:changed ? await emailFor(name) : null, p_password:pw || null});
      if (changed) { chk(await sb.from('profiles').update({name}).eq('id', me.id)); put('config', 'main', Object.assign({}, c, {admin:{name}})); }
      const f = $('#ad_pass'); if (f) f.value = '';
      toast('تم حفظ الحساب');
    } catch (e) { toast(errText(e), 'err'); } finally { busy = false; }
  },
  printReport(){
    const head = document.createElement('div');
    head.id = 'printHead';
    head.innerHTML = `<div class="p-logo">${logo(52)}</div><div class="p-info"><h1>${esc(cfg().churchName)}</h1><h2>تقرير الحضور والتقييمات</h2><p>${esc($('#main .ph p') ? $('#main .ph p').textContent : '')}</p></div>`;
    document.body.appendChild(head);
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); head.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  },
  exportCsv(){
    if (!lastReport) return;
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    saveFile('report-' + lastReport.name + '.csv', '\ufeff' + lastReport.rows.map(r => r.map(q).join(',')).join('\r\n'));
  },
  exportBackup(){ saveFile('church-backup-' + today() + '.json', JSON.stringify({exportedAt:new Date().toISOString(), data:S}, null, 2)); },
  wipe(){
    modalCtx = {};
    openModal('مسح كل البيانات', '<p style="margin-top:0">سيتم حذف كل شيء نهائيًا. للتأكيد اكتب كلمة <b>حذف</b> في الخانة.</p><input type="text" name="word" autocomplete="off">', '<button class="btn danger" data-a="wipeYes">مسح كل شيء</button><button class="btn" data-a="closeModal">إلغاء</button>');
  },
  async wipeYes(){
    if (V('word').trim() !== 'حذف') return toast('اكتب كلمة حذف للتأكيد', 'err');
    closeModal(); toast('جارٍ مسح البيانات…');
    try { await rpc('admin_wipe_data'); refreshAll(0); toast('تم مسح كل البيانات'); } catch (e) { toast(errText(e), 'err'); }
  }
};
const CH = {
  logoFile(t){
    const f = t.files && t.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) return toast('اختر ملف صورة', 'err');
    if (f.size > 700 * 1024) return toast('حجم الصورة كبير. اختر صورة أصغر من ٧٠٠ كيلوبايت', 'err');
    const reader = new FileReader();
    reader.onload = () => { put('config', 'main', Object.assign({}, cfg(), {logoUrl:reader.result})); toast('تم حفظ الشعار'); };
    reader.onerror = () => toast('تعذّر قراءة الصورة', 'err');
    reader.readAsDataURL(f);
  },
  attDate(t){ ui.attDate = t.value || today(); render(); },
  attClass(t){ ui.attClass = t.value; render(); },
  evDate(t){ ui.evDate = t.value || today(); render(); },
  evClass(t){ ui.evClass = t.value; render(); },
  fService(t){ ui.fService = t.value; ui.fClass = ''; render(); },
  fClass(t){ ui.fClass = t.value; render(); },
  showArchived(t){ ui.showArchived = t.checked; render(); },
  repRange(t){ ui.rep.range = t.value; render(); },
  repFrom(t){ ui.rep.from = t.value; render(); },
  repTo(t){ ui.rep.to = t.value; render(); },
  repService(t){ ui.rep.service = t.value; ui.rep.cls = ''; render(); },
  repCls(t){ ui.rep.cls = t.value; render(); },
  repSort(t){ ui.rep.sort = t.value; render(); }
};
async function saveFile(name, data){
  try {
    const blob = new Blob([data], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { toast('تعذّر تنزيل الملف', 'err'); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const f = A[t.dataset.a]; if (f) f(t, e);
});
document.addEventListener('change', e => {
  const tt = e.target.closest('[data-a-time]'); if (tt) { A.setTime(tt); return; }
  const t = e.target.closest('[data-c]'); if (t && CH[t.dataset.c]) CH[t.dataset.c](t);
});
document.addEventListener('input', e => { const t = e.target.closest('[data-i]'); if (t && t.dataset.i === 'q') { ui.q = t.value; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').firstChild) closeModal();
  if (e.key === 'Enter') { const t = e.target.closest && e.target.closest('[data-enter]'); if (t && A[t.dataset.enter]) { e.preventDefault(); A[t.dataset.enter](t, e); } }
});

/* ---------- data bootstrap ---------- */
const DEFAULT_CRITERIA = [{id:'c1', name:'الالتزام والسلوك'}, {id:'c2', name:'المشاركة'}, {id:'c3', name:'الحفظ والاستيعاب'}];
/* ---------- boot ---------- */
async function loadPub(){ const d = await rpc('public_info'); pub = {has_admin:!!(d && d.has_admin), church:(d && d.church) || ''}; }
async function enterSession(userId){
  const r = await sb.from('profiles').select('id,name,role,active').eq('id', userId).maybeSingle();
  if (r.error) throw r.error;
  const prof = r.data;
  if (!prof || !prof.active) {
    try { await sb.auth.signOut(); } catch (e) {}
    toast(prof ? 'الحساب ده موقوف. كلّم مسؤول النظام.' : 'الحساب مش موجود.', 'err');
    return false;
  }
  me = {role:prof.role, id:prof.id}; ui.view = 'dashboard';
  startSync();
  return true;
}
async function init(){
  render();
  if (!sb) { fatal = 'config'; loaded = true; render(); return; }
  try {
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && me) { me = null; stopSync(); scheduleRender(); } });
    await loadPub();
    const g = await sb.auth.getSession();
    if (g.data && g.data.session) { try { await enterSession(g.data.session.user.id); } catch (e) { console.error(e); } }
  } catch (e) { console.error(e); fatal = 'connect'; }
  loaded = true; render();
}
init();
})();
</script>
